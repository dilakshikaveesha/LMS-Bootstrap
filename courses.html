
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Courses - LMS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html">LMS</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>

            
<button type="button" onclick="toggleDarkMode()">
    Toggle Dark Mode
</button>

        </div>
    </nav>

    <main class="container">
        <h2>Our Courses</h2>

        <div class="course-container">

            <div class="course-card">
                <div class="course-image">Programming</div>
                <div class="course-info">
                    <h4>Programming Basics</h4>
                    <button onclick="showDetails(
                        'Programming Basics',
                        'Learn Python programming from scratch.'
                    )">View Details</button>
                </div>
            </div>

            <div class="course-card">
                <div class="course-image">AI Fundamentals</div>
                <div class="course-info">
                    <h4>AI Fundamentals</h4>
                    <button onclick="showDetails(
                        'AI Fundamentals',
                        'Learn the basic concepts of Artificial Intelligence.'
                    )">View Details</button>
                </div>
            </div>

            <div class="course-card">
                <div class="course-image">UI Design</div>
                <div class="course-info">
                    <h4>UI Design</h4>
                    <button onclick="showDetails(
                        'UI Design',
                        'Learn the fundamentals of user interface design.'
                    )">View Details</button>
                </div>
            </div>

        </div>
    </main>

    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <button class="close-button"
                onclick="closeDetails()">×</button>

            <h3 id="courseTitle"></h3>
            <p id="courseDescription"></p>

            <button onclick="closeDetails()">Close</button>
        </div>
    </div>

    <footer>
        © 2024 LMS Platform. All Rights Reserved.
    </footer>

    <script src="script.js"></script>

    
</body>
